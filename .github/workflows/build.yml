name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core JVM tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon :uhabits-core:jvmTest 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: .github/scripts/report-errors.sh build.log
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: uhabits-core/build/reports/tests

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK and run unit tests
        env:
          # Repository variable, so the server address stays out of the repo.
          ORG_GRADLE_PROJECT_loopSyncServerUrl: ${{ vars.LOOP_SYNC_SERVER_URL }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon :uhabits-android:assembleDebug :uhabits-android:testDebugUnitTest 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: .github/scripts/report-errors.sh build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loop-debug-apk
          path: uhabits-android/build/outputs/apk/debug/*.apk
      - name: Lint (Kotlin style, informational)
        continue-on-error: true
        run: ./gradlew --no-daemon ktlintCheck
